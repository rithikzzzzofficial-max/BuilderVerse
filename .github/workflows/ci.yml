name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile can't be built on the dev machine (no Docker Desktop),
      # so CI is where it gets verified.
      - name: Build image
        run: docker build -t builderverse:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name bv -p 3300:3000 builderverse:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3300/api/health; then exit 0; fi
            sleep 2
          done
          echo "health check never passed"; docker logs bv; exit 1
